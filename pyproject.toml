[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "linkmon"
version = "2.0.0"
description = "Dauermessung der Verfügbarkeit eines Internetanschlusses: Ausfälle, Ping und Paketverlust"
requires-python = ">=3.11"
dependencies = [
    "dash>=2.17",
    "dnspython>=2.6",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.20",
    "psutil>=5.9",
    "reportlab>=4.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
linkmon = "linkmon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linkmon = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
